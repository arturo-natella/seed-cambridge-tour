ction — The warm-fluid bypass</h2><small>The yellow mixing-valve actuator and separate drain route at the central pipe bridge.</small></div><a href="Freeze-detail.png" download>Download PNG ↓</a></figcaption></figure><figure><a href="Cooler-detail.png"><img loading="lazy" src="Cooler-detail.png" alt="Two shut-off valves and an outlet freeze sensor. The low-point drain is on the opposite side."></a><figcaption><div><h2>At each cooler — Isolate and sense</h2><small>Two shut-off valves and an outlet freeze sensor. The low-point drain is on the opposite side.</small></div><a href="Cooler-detail.png" download>Download PNG ↓</a></figcaption></figure><figure><a href="Drain-detail.png"><img loading="lazy" src="Drain-detail.png" alt="Cooler drains lead to the indoor tanks. Sizes and final drainability remain to be engineered."></a><figcaption><div><h2>Indoor storage — Drain-down and expansion tanks</h2><small>Cooler drains lead to the indoor tanks. Sizes and final drainability remain to be engineered.</small></div><a href="Drain-detail.png" download>Download PNG ↓</a></figcaption></figure><figure><a href="FreshAir-detail.png"><img loading="lazy" src="FreshAir-detail.png" alt="A drying coil, outside-air louver and condensate drain. Dehumidification capacity remains to be sized."></a><figcaption><div><h2>Dry halls — Fresh-air equipment</h2><small>A drying coil, outside-air louver and condensate drain. Dehumidification capacity remains to be sized.</small></div><a href="FreshAir-detail.png" download>Download PNG ↓</a></figcaption></figure><p>Proposed design; the Cambridge parcel is illustrative. These are Blender renders of the same model used by the interactive tour.</p></main></html>
